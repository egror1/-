name: Lab 3 checks
on: push
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -Wpedantic main.cpp Application.cpp Roots.cpp -o roots.out
      - run: python3 tests/test_roots.py ./roots.out
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run -Werror main.cpp Application.cpp Roots.cpp Application.hpp Roots.hpp
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - run: clang-tidy-18 main.cpp Application.cpp Roots.cpp -- -std=c++20
