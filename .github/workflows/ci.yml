name: Lab 3 checks
on: push
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -Wpedantic main.cpp Application.cpp Roots.cpp -o roots.out
      - run: python3 tests/test_roots.py ./roots.out
  clang-format:
    runs-on: ubuntu-latest
    container: ghcr.io/cpp-linter/clang-tools:18
    steps:
      - uses: actions/checkout@v4
      - run: clang-format --dry-run -Werror main.cpp Application.cpp Roots.cpp Application.hpp Roots.hpp
  clang-tidy:
    runs-on: ubuntu-latest
    container: ghcr.io/cpp-linter/clang-tools:18
    steps:
      - uses: actions/checkout@v4
      - run: clang-tidy main.cpp Application.cpp Roots.cpp -- -std=c++20
